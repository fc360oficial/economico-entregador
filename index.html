<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Entregador — Econômico</title>
  <meta name="theme-color" content="#0d0d0d"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:#f5f5f5;color:#1a1a1a;font-family:'Inter',system-ui,sans-serif;min-height:100vh}
    :root{--y:#FFC600;--dark:#f5f5f5;--card:#ffffff;--border:#e8e8e8;--text2:#888;--green:#2d9e62;--red:#e74c3c}

    /* LOGIN */
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .login-box{background:var(--card);border-radius:20px;padding:40px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.1)}
    .login-logo{font-size:44px;margin-bottom:10px}
    .login-title{font-size:22px;font-weight:900;color:#111;margin-bottom:4px}
    .login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
    .login-input{width:100%;background:#f9f9f9;border:1.5px solid var(--border);border-radius:10px;padding:13px 16px;color:#1a1a1a;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;transition:border-color .2s}
    .login-input:focus{border-color:var(--y)}
    .login-btn{width:100%;padding:14px;border-radius:10px;background:var(--y);border:none;color:#000;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
    .login-err{font-size:12px;color:var(--red);margin-top:8px;min-height:18px}

    /* APP */
    #app-screen{display:none;flex-direction:column;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}

    /* HEADER */
    .header{background:#fff;border-top:5px solid var(--y);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.07)}
    .header-logo{font-size:17px;font-weight:800;color:#111}
    .header-sub{font-size:11px;color:var(--text2);margin-top:1px}
    .header-right{display:flex;align-items:center;gap:8px}
    .badge-live{display:flex;align-items:center;gap:6px;background:#f5f5f5;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--text2)}
    .badge-live .dot{width:7px;height:7px;border-radius:50%;background:#555;transition:background .3s}
    .badge-live .dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
    .btn-logout{background:none;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit}

    /* CONTEÚDO */
    .content{padding:16px}
    .empty{text-align:center;padding:80px 24px}
    .empty-icon{font-size:56px;margin-bottom:16px}
    .empty-title{font-size:18px;font-weight:800;color:#1a1a1a;margin-bottom:8px}
    .empty-sub{font-size:13px;color:var(--text2);line-height:1.5}

    /* CARD */
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;transition:border-color .3s,opacity .3s;box-shadow:0 2px 12px rgba(0,0,0,.07)}
    .card-header{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .card-num{font-size:13px;font-weight:800;color:#1a1a1a}
    .card-nome{font-size:16px;font-weight:700;color:#1a1a1a;margin-top:2px}
    .badge-saiu{background:rgba(45,158,98,.12);color:var(--green);border:1px solid rgba(45,158,98,.3);border-radius:20px;font-size:10px;font-weight:700;padding:3px 10px;white-space:nowrap;flex-shrink:0}

    .card-info{padding:0 16px 12px;display:flex;flex-direction:column;gap:7px}
    .info-row{display:flex;align-items:flex-start;gap:8px;font-size:13px}
    .info-icon{font-size:15px;flex-shrink:0;margin-top:1px}
    .info-val{color:#555;line-height:1.4;flex:1}
    .info-val strong{color:#111}

    /* ROTA COMPLETA */
    .rota-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:var(--y);border:none;border-radius:12px;color:#111;font-size:13px;font-weight:800;text-decoration:none;margin-bottom:14px;cursor:pointer;transition:filter .2s}
    .rota-btn:active{filter:brightness(.92)}
    .seq-badge{background:#FFC600;color:#000;border-radius:20px;font-size:10px;font-weight:800;padding:3px 10px;white-space:nowrap;flex-shrink:0}

    /* MAPA */
    .map-btns{display:flex;gap:6px;margin-top:6px}
    .btn-map{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--border);background:#fff;color:#555;font-size:12px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:border-color .2s,color .2s}
    .btn-map:active{border-color:var(--y);color:#a07000}

    /* ITENS */
    .itens-section{border-top:1px solid var(--border);padding:10px 16px 12px}
    .itens-title{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
    .item-row{font-size:12px;color:#555;display:flex;align-items:center;gap:6px;margin-bottom:4px}
    .item-qty{background:#f0f0f0;color:#a07000;font-weight:800;font-size:11px;padding:1px 7px;border-radius:4px;flex-shrink:0;min-width:24px;text-align:center}

    /* PAGAMENTO */
    .pag-pix-pago{color:var(--green);font-weight:700}
    .pag-pix-pend{color:#d68910;font-weight:700}
    .pag-cartao{color:#aaa;font-weight:600}

    /* CÓDIGO */
    .cod-section{border-top:1px solid var(--border);padding:14px 16px 16px}
    .cod-label{font-size:11px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .cod-row{display:flex;gap:8px;align-items:center}
    .cod-input{flex:1;background:#f9f9f9;border:2px solid var(--border);border-radius:10px;color:#1a1a1a;font-size:26px;font-weight:800;font-family:monospace;letter-spacing:8px;text-align:center;padding:10px 8px;outline:none;transition:border-color .2s;-webkit-appearance:none}
    .cod-input:focus{border-color:var(--y)}
    .cod-input.erro{border-color:var(--red);animation:shake .3s}
    .cod-input.ok{border-color:var(--green)}
    .btn-confirmar{background:var(--y);color:#000;border:none;border-radius:10px;font-size:14px;font-weight:800;padding:12px 18px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:opacity .2s;flex-shrink:0}
    .btn-confirmar:active{opacity:.8}
    .btn-confirmar:disabled{opacity:.4;cursor:not-allowed}
    .btn-nao-atendeu{width:100%;margin-top:10px;padding:10px;border-radius:10px;background:none;border:1px solid rgba(231,76,60,.3);color:#c0392b;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
    .btn-nao-atendeu:active{background:rgba(231,76,60,.12);border-color:var(--red)}

    /* ENTREGUE */
    .card.entregue-ok{border-color:var(--green);opacity:.55}
    .entregue-banner{background:rgba(45,158,98,.08);border-top:1px solid rgba(45,158,98,.3);padding:12px 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--green)}
    .nao-atendido-banner{background:rgba(231,76,60,.07);border-top:1px solid rgba(231,76,60,.25);padding:12px 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--red)}

    /* HISTÓRICO */
    .hist-section{margin-top:4px;padding-top:20px;border-top:2px solid var(--border)}
    .hist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .hist-title{font-size:12px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
    .hist-total{font-size:12px;font-weight:800;color:var(--green)}
    .hist-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    .hist-left{flex:1;min-width:0}
    .hist-num{font-size:11px;font-weight:800;color:#a07000}
    .hist-nome{font-size:13px;font-weight:700;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hist-end{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hist-val{text-align:right;flex-shrink:0}
    .hist-valor{font-size:14px;font-weight:800;color:var(--green)}
    .hist-ok{font-size:10px;color:var(--green);margin-top:2px}

    /* FOTO */
    .btn-foto{width:100%;padding:12px;border-radius:10px;background:rgba(59,130,246,.07);border:1px dashed #3b82f6;color:#2563eb;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
    .btn-foto:active{background:rgba(59,130,246,.14)}
    .foto-thumb{width:100%;border-radius:10px;max-height:220px;object-fit:cover;margin-top:10px;border:2px solid var(--green)}
    .foto-ok{font-size:11px;color:var(--green);font-weight:700;margin-top:6px;text-align:center}
    .foto-progress{font-size:12px;color:var(--text2);margin-top:8px;text-align:center}

    /* TOAST */
    .toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;pointer-events:none;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* LOADING */
    .loading{text-align:center;padding:60px 20px;color:var(--text2);font-size:14px}
    .spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:var(--y);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  </style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🛵</div>
    <div class="login-title">Entregador</div>
    <div class="login-sub">Econômico Delivery</div>
    <input class="login-input" type="password" id="senha-input" placeholder="Senha de acesso"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────────────────── -->
<div id="app-screen">

  <div class="header">
    <div>
      <div class="header-logo">🛵 Econômico Entregas</div>
      <div class="header-sub">Painel do Entregador</div>
    </div>
    <div class="header-right">
      <div class="badge-live">
        <div class="dot" id="dot-live"></div>
        <span id="lbl-live">Conectando…</span>
      </div>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="content">
    <div id="lista">
      <div class="loading"><div class="spinner"></div>Buscando pedidos…</div>
    </div>
    <div id="nao-atendido-wrap" style="display:none">
      <div class="hist-section" style="border-top-color:#3a1a1a">
        <div class="hist-header">
          <div class="hist-title" style="color:#c0392b">⚠️ Não atendidos hoje</div>
        </div>
        <div id="nao-atendido-lista"></div>
      </div>
    </div>
    <div id="hist-wrap" style="display:none">
      <div class="hist-section">
        <div class="hist-header">
          <div class="hist-title">✅ Entregas de hoje</div>
          <div class="hist-total" id="hist-total"></div>
        </div>
        <div id="hist-lista"></div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyCfUZxP0gNPVOAdUsGuoRNSQlfbEsNMUCA",
    authDomain: "economico-delivery.firebaseapp.com",
    projectId: "economico-delivery",
    storageBucket: "economico-delivery.appspot.com",
    messagingSenderId: "561359988054",
    appId: "1:561359988054:web:5a4c17f2ced6150ccae2f7"
  });
  var db      = firebase.firestore();
  var storage = firebase.storage();

  // ── senha ────────────────────────────────────────────────────────────────────
  var ENTREGADOR_PASS_DEFAULT = 'entregador2024';
  var _entPass  = ENTREGADOR_PASS_DEFAULT;
  var _endLoja  = 'Rua Antonio Luiz Soares, 217, Pernambuco';
  var _logado   = localStorage.getItem('ec_entregador') === '1';
  var _unsubRota = null, _unsubHist = null, _unsubNaoAtendido = null, _entreguesHoje = 0;

  db.collection('config').doc('loja').get().then(function(doc) {
    if (!doc.exists) return;
    if (doc.data().entregadorPass) _entPass = doc.data().entregadorPass;
    if (doc.data().enderecoLoja)   _endLoja = doc.data().enderecoLoja;
  });

  // ── login / logout ───────────────────────────────────────────────────────────
  function doLogin() {
    var senha = document.getElementById('senha-input').value;
    if (senha === _entPass) {
      _logado = true;
      localStorage.setItem('ec_entregador', '1');
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'flex';
      iniciarListeners();
      pedirPermissaoNotificacao();
    } else {
      document.getElementById('login-err').textContent = 'Senha incorreta.';
      setTimeout(function(){ document.getElementById('login-err').textContent = ''; }, 2000);
    }
  }

  function logout() {
    localStorage.removeItem('ec_entregador');
    if (_unsubRota) { _unsubRota(); _unsubRota = null; }
    if (_unsubHist) { _unsubHist(); _unsubHist = null; }
    if (_unsubNaoAtendido) { _unsubNaoAtendido(); _unsubNaoAtendido = null; }
    _conhecidos = null;
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('senha-input').value = '';
  }

  if (_logado) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    iniciarListeners();
  }

  // ── notificação + som ────────────────────────────────────────────────────────
  var _audioCtx  = null;
  var _conhecidos = null;

  function pedirPermissaoNotificacao() {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
  document.addEventListener('click', function() { _initAudio(); pedirPermissaoNotificacao(); }, { once: true });

  function _initAudio() {
    if (!_audioCtx) try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }

  function playApito(num) {
    _initAudio();
    if (_audioCtx) {
      [523, 659, 784, 1047, 784].forEach(function(freq, i) {
        var o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
        o.connect(g); g.connect(_audioCtx.destination);
        o.type = 'triangle'; o.frequency.value = freq;
        var t = _audioCtx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0.4, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.32);
      });
    }
    if ('Notification' in window && Notification.permission === 'granted')
      new Notification('🛵 Nova entrega!', { body: 'Pedido ' + num + ' aguarda.', icon: 'https://fc360oficial.github.io/economicodelivery/logo.png' });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  // ── utils ────────────────────────────────────────────────────────────────────
  function toast(msg, dur) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, dur || 2200);
  }

  function fmtVal(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }

  function _atualizarContador(pendentes) {
    var lbl = document.getElementById('lbl-live');
    if (!lbl) return;
    var txt = pendentes + ' pendente' + (pendentes !== 1 ? 's' : '');
    if (_entreguesHoje > 0) txt += ' · ' + _entreguesHoje + ' ✅';
    lbl.textContent = txt;
  }

  function mapsUrl(end) {
    return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(_endLoja) + '&destination=' + encodeURIComponent(end) + '&travelmode=driving';
  }
  function wazeUrl(end) {
    return 'https://waze.com/ul?navigate=yes&q=' + encodeURIComponent(end);
  }

  // ── card HTML ────────────────────────────────────────────────────────────────
  function cardHtml(doc, idx, total) {
    var d   = doc.data();
    var ph  = (d.phone || '').replace(/\D/g, '');
    var end = [d.endLogradouro || d.endereco, d.endNumero, d.endComplemento, d.endBairro, d.endCidade]
                .filter(Boolean).join(', ') || d.enderecoCompleto || '—';

    // pagamento
    var pagHtml = d.pagamento === 'pix'
      ? (d.pagamentoPago
          ? '<span class="pag-pix-pago">PIX ✓ pago</span>'
          : '<span class="pag-pix-pend">PIX ⚠ pendente</span>')
      : '<span class="pag-cartao">Cartão na entrega</span>';

    // botões de mapa
    var mapHtml = end !== '—'
      ? '<div class="map-btns">'
        + '<a class="btn-map" href="' + mapsUrl(end) + '" target="_blank">🗺️ Google Maps</a>'
        + '<a class="btn-map" href="' + wazeUrl(end) + '" target="_blank">🔵 Waze</a>'
        + '</div>'
      : '';

    // itens
    var itensHtml = '';
    if (d.itens && d.itens.length) {
      itensHtml = '<div class="itens-section">'
        + '<div class="itens-title">📦 Itens do pedido</div>'
        + d.itens.map(function(it) {
            return '<div class="item-row"><span class="item-qty">' + it.qty + 'x</span>' + it.name + '</div>';
          }).join('')
        + '</div>';
    }

    // seção código
    var codHtml = d.codigoEntrega
      ? '<div class="cod-section">'
        + '<div class="cod-label">🔐 Peça o código ao cliente</div>'
        + '<div class="cod-row">'
        +   '<input type="tel" id="inp-' + doc.id + '" class="cod-input" maxlength="4" placeholder="· · · ·" inputmode="numeric" oninput="this.value=this.value.replace(/\\D/g,\'\')">'
        +   '<button class="btn-confirmar" id="btn-' + doc.id + '" onclick="confirmar(\'' + doc.id + '\',\'' + d.codigoEntrega + '\',\'' + encodeURIComponent(d.nome || '') + '\',\'' + encodeURIComponent(d.num || '') + '\',\'' + ph + '\')">✓ Confirmar</button>'
        + '</div>'
        + '<button class="btn-nao-atendeu" onclick="naoAtendeu(\'' + doc.id + '\',\'' + encodeURIComponent(d.nome || '') + '\',\'' + encodeURIComponent(d.num || '') + '\',\'' + ph + '\')">❌ Cliente não atendeu</button>'
        + '</div>'
      : '<div class="cod-section" style="padding:10px 16px 14px"><div style="font-size:12px;color:var(--text2)">Aguardando código…</div></div>';

    var parada = total > 1 ? (idx + 1) + 'ª parada' : 'Em rota';
    return '<div class="card" id="card-' + doc.id + '">'
      + '<div class="card-header">'
      +   '<div><div class="card-num">Pedido ' + d.num + '</div><div class="card-nome">' + (d.nome || 'Cliente') + '</div></div>'
      +   '<span class="seq-badge">🛵 ' + parada + '</span>'
      + '</div>'
      + '<div class="card-info">'
      +   '<div class="info-row"><span class="info-icon">📍</span><span class="info-val">' + end + '</span></div>'
      +   (mapHtml ? '<div class="info-row"><span class="info-icon" style="opacity:0">·</span><span class="info-val">' + mapHtml + '</span></div>' : '')
      +   '<div class="info-row"><span class="info-icon">💳</span><span class="info-val">' + pagHtml + ' &nbsp;·&nbsp; <strong>' + fmtVal(d.total) + '</strong></span></div>'
      +   (ph ? '<div class="info-row"><span class="info-icon">📱</span><span class="info-val"><a href="https://wa.me/55' + ph + '" style="color:#2563eb;text-decoration:none">' + d.phone + '</a></span></div>' : '')
      + '</div>'
      + itensHtml
      + codHtml
      + '</div>';
  }

  // ── não atendidos ────────────────────────────────────────────────────────────
  function renderNaoAtendidos(docs) {
    var wrap  = document.getElementById('nao-atendido-wrap');
    var lista = document.getElementById('nao-atendido-lista');
    if (!docs || !docs.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    lista.innerHTML = docs.map(function(doc) {
      var d   = doc.data();
      var end = [d.endLogradouro || d.endereco, d.endBairro].filter(Boolean).join(', ') || '—';
      return '<div class="hist-card" style="background:#1a0a0a;border-color:#3a1a1a">'
        + '<div class="hist-left">'
        +   '<div class="hist-num">Pedido ' + d.num + '</div>'
        +   '<div class="hist-nome">' + (d.nome || 'Cliente') + '</div>'
        +   '<div class="hist-end">' + end + '</div>'
        + '</div>'
        + '<div class="hist-val"><div style="font-size:13px;font-weight:800;color:#c0392b">⚠️ Não atendeu</div><div style="font-size:10px;color:#888;margin-top:2px">retornou à loja</div></div>'
        + '</div>';
    }).join('');
  }

  // ── histórico ────────────────────────────────────────────────────────────────
  function renderHistorico(docs) {
    var wrap    = document.getElementById('hist-wrap');
    var lista   = document.getElementById('hist-lista');
    var totalEl = document.getElementById('hist-total');
    _entreguesHoje = docs ? docs.length : 0;
    if (!docs || !docs.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    var soma = docs.reduce(function(acc, doc) { return acc + Number(doc.data().total || 0); }, 0);
    totalEl.textContent = docs.length + ' entrega' + (docs.length > 1 ? 's' : '') + ' · ' + fmtVal(soma);
    lista.innerHTML = docs.map(function(doc) {
      var d = doc.data();
      var end = [d.endLogradouro || d.endereco, d.endBairro].filter(Boolean).join(', ') || '—';
      return '<div class="hist-card">'
        + '<div class="hist-left">'
        +   '<div class="hist-num">Pedido ' + d.num + '</div>'
        +   '<div class="hist-nome">' + (d.nome || 'Cliente') + '</div>'
        +   '<div class="hist-end">' + end + '</div>'
        + '</div>'
        + '<div class="hist-val"><div class="hist-valor">' + fmtVal(d.total) + '</div><div class="hist-ok">✅ entregue</div></div>'
        + '</div>';
    }).join('');
  }

  // ── listeners Firestore ──────────────────────────────────────────────────────
  function iniciarListeners() {
    // pedidos em rota (apenas entrega domiciliar)
    _unsubRota = db.collection('pedidos')
      .where('status', '==', 'saiu')
      .onSnapshot(function(snap) {
        var docs = snap.docs.filter(function(doc) {
          var m = doc.data().modo; return !m || m === 'entrega';
        });

        // ordena por bairro (agrupa entregas próximas)
        docs.sort(function(a, b) {
          var ba = (a.data().endBairro || a.data().endereco || '').toLowerCase();
          var bb = (b.data().endBairro || b.data().endereco || '').toLowerCase();
          return ba.localeCompare(bb, 'pt');
        });

        var ids = docs.map(function(d) { return d.id; });
        if (_conhecidos !== null) {
          var novos = docs.filter(function(d) { return _conhecidos.indexOf(d.id) === -1; });
          if (novos.length) { playApito(novos[0].data().num || ''); toast('🛵 Nova entrega chegou!', 3500); }
        }
        _conhecidos = ids;

        document.getElementById('dot-live').classList.add('on');
        _atualizarContador(docs.length);

        var lista = document.getElementById('lista');
        if (!docs.length) {
          lista.innerHTML = '<div class="empty"><div class="empty-icon">🛵</div>'
            + '<div class="empty-title">Nenhuma entrega no momento</div>'
            + '<div class="empty-sub">Quando um pedido sair para entrega ele aparecerá aqui automaticamente.</div></div>';
        } else {
          // botão rota completa (2+ paradas)
          var rotaBtn = '';
          if (docs.length >= 2) {
            var enderecos = docs.map(function(doc) {
              var d = doc.data();
              return [d.endLogradouro || d.endereco, d.endNumero, d.endBairro, d.endCidade || 'Pernambuco'].filter(Boolean).join(', ');
            });
            var mapsRota = 'https://www.google.com/maps/dir/' + [_endLoja].concat(enderecos).map(encodeURIComponent).join('/');
            rotaBtn = '<a class="rota-btn" href="' + mapsRota + '" target="_blank">🗺️ Ver rota completa · ' + docs.length + ' paradas</a>';
          }
          lista.innerHTML = rotaBtn + docs.map(function(doc, i) { return cardHtml(doc, i, docs.length); }).join('');
        }

      }, function() {
        document.getElementById('dot-live').classList.remove('on');
        document.getElementById('lbl-live').textContent = 'Erro de conexão';
        document.getElementById('lista').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>'
          + '<div class="empty-title">Sem conexão</div>'
          + '<div class="empty-sub">Verifique sua internet e recarregue a página.</div></div>';
      });

    // histórico do dia
    var hoje      = new Date();
    var inicioDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());

    _unsubHist = db.collection('pedidos')
      .where('status', '==', 'entregue')
      .onSnapshot(function(snap) {
        var docs = snap.docs.filter(function(doc) {
          var d = doc.data();
          if (!d.createdAt) return false;
          var ts = d.createdAt.toDate ? d.createdAt.toDate() : new Date(d.createdAt.seconds * 1000);
          var m  = d.modo;
          return ts >= inicioDia && (!m || m === 'entrega');
        });
        renderHistorico(docs);
      }, function() {});

    // não atendidos do dia
    _unsubNaoAtendido = db.collection('pedidos')
      .where('status', '==', 'nao_atendido')
      .onSnapshot(function(snap) {
        var docs = snap.docs.filter(function(doc) {
          var d = doc.data();
          if (!d.createdAt) return false;
          var ts = d.createdAt.toDate ? d.createdAt.toDate() : new Date(d.createdAt.seconds * 1000);
          return ts >= inicioDia;
        });
        renderNaoAtendidos(docs);
      }, function() {});
  }

  // ── confirmar entrega ────────────────────────────────────────────────────────
  function confirmar(docId, codigoCorreto, nomeEnc, numEnc, phone) {
    var input = document.getElementById('inp-' + docId);
    var btn   = document.getElementById('btn-' + docId);
    var cod   = input ? input.value.trim() : '';

    if (cod.length !== 4) { toast('Digite os 4 dígitos do cliente'); input && input.focus(); return; }
    if (cod !== codigoCorreto) {
      toast('❌ Código incorreto! Peça novamente ao cliente.');
      if (input) {
        input.classList.add('erro'); input.value = '';
        setTimeout(function() { input.classList.remove('erro'); }, 800);
        input.focus();
      }
      return;
    }

    btn.disabled = true; btn.textContent = '⏳';
    input.classList.add('ok');

    db.collection('pedidos').doc(docId).update({ status: 'entregue' })
      .then(function() {
        toast('✅ Entrega confirmada!', 3000);
        var card = document.getElementById('card-' + docId);
        if (card) {
          var sec = card.querySelector('.cod-section');
          if (sec) sec.innerHTML = '<div class="entregue-banner">✅ Entrega confirmada!</div>'
            + '<div style="padding:0 16px 16px">'
            +   '<button class="btn-foto" onclick="triggerFoto(\'' + docId + '\')">'
            +     '📷 Fotografar sacolas entregues'
            +   '</button>'
            +   '<input type="file" id="foto-' + docId + '" accept="image/*" capture="environment" style="display:none" onchange="uploadFoto(\'' + docId + '\',this)">'
            +   '<div id="foto-status-' + docId + '"></div>'
            + '</div>';
          card.classList.add('entregue-ok');
        }
        if (phone) {
          var msg = '✅ Olá ' + decodeURIComponent(nomeEnc) + '! Seu pedido '
            + decodeURIComponent(numEnc) + ' foi entregue com sucesso. Obrigado pela preferência! 😊';
          window.open('https://wa.me/55' + phone + '?text=' + encodeURIComponent(msg), '_blank');
        }
      })
      .catch(function(e) {
        btn.disabled = false; btn.textContent = '✓ Confirmar';
        input.classList.remove('ok'); toast('Erro: ' + e.message);
      });
  }

  // ── foto de entrega ──────────────────────────────────────────────────────────
  function triggerFoto(docId) {
    var el = document.getElementById('foto-' + docId);
    if (el) el.click();
  }

  function uploadFoto(docId, input) {
    var file = input.files[0];
    if (!file) return;
    var statusEl = document.getElementById('foto-status-' + docId);
    if (statusEl) statusEl.innerHTML = '<div class="foto-progress">⏳ Enviando foto…</div>';

    var ref = storage.ref('entregas/' + docId + '/foto_entrega.jpg');
    ref.put(file, { contentType: file.type })
      .then(function() { return ref.getDownloadURL(); })
      .then(function(url) {
        return db.collection('pedidos').doc(docId).update({ fotoEntregaUrl: url })
          .then(function() { return url; });
      })
      .then(function(url) {
        if (statusEl) statusEl.innerHTML =
          '<img src="' + url + '" class="foto-thumb">'
          + '<div class="foto-ok">✅ Foto registrada com sucesso</div>';
        // esconde botão de foto
        var btnFoto = statusEl && statusEl.previousElementSibling && statusEl.previousElementSibling.previousElementSibling;
        if (btnFoto && btnFoto.classList.contains('btn-foto')) btnFoto.style.display = 'none';
        toast('📷 Foto salva!', 2500);
      })
      .catch(function(e) {
        if (statusEl) statusEl.innerHTML = '<div style="font-size:12px;color:var(--red);margin-top:8px;text-align:center">Erro ao enviar. Tente novamente.</div>';
        toast('Erro: ' + e.message);
      });
  }

  // ── cliente não atendeu ──────────────────────────────────────────────────────
  function naoAtendeu(docId, nomeEnc, numEnc, phone) {
    if (!confirm('Confirmar que o cliente não atendeu no pedido ' + decodeURIComponent(numEnc) + '?')) return;
    db.collection('pedidos').doc(docId).update({ status: 'nao_atendido' })
      .then(function() {
        toast('⚠️ Registrado — loja será avisada.', 3000);
        var card = document.getElementById('card-' + docId);
        if (card) {
          var sec = card.querySelector('.cod-section');
          if (sec) sec.innerHTML = '<div class="nao-atendido-banner">⚠️ Cliente não atendeu — loja avisada</div>';
          card.style.borderColor = 'var(--red)';
          card.style.opacity = '.6';
        }
      })
      .catch(function(e) { toast('Erro: ' + e.message); });
  }
</script>
